[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l4-autonomy-platform"
version = "0.1.0"
description = "CARLA tabanlı, ODD sınırlı Seviye 4 araştırma platformu"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.9,<1.0",
]
docs = [
  "mkdocs>=1.6,<2.0",
  "mkdocs-material>=9.5,<10.0",
  "pymdown-extensions>=10.0,<11.0",
]

[project.scripts]
autonomy-launcher = "autonomy.application.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autonomy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
